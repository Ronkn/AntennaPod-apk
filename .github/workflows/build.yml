name: Build APK
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Restore signing key
        env:
          KEY_B64: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          mkdir -p ~/.android
          echo "$KEY_B64" | base64 -d > ~/.android/debug.keystore
      - name: Build
        run: chmod +x gradlew && ./gradlew assembleFreeDebug
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-$(date +%Y%m%d-%H%M)-${GITHUB_SHA::7}"
          gh release create "$TAG" $(find app/build/outputs/apk -name '*.apk') \
            --title "$TAG" --notes "Automated build of $GITHUB_SHA"
