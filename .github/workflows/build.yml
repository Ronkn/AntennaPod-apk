name: Build APK
on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check for new upstream release
        id: check
        run: |
          TAG=$(gh release view --repo AntennaPod/AntennaPod --json tagName -q .tagName)
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.check.outputs.new == 'true'
        with:
          repository: AntennaPod/AntennaPod
          ref: ${{ steps.check.outputs.tag }}
      - uses: actions/setup-java@v4
        if: steps.check.outputs.new == 'true'
        with:
          distribution: temurin
          java-version: 21
      - name: Restore signing key
        if: steps.check.outputs.new == 'true'
        env:
          KEY_B64: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          test -n "$KEY_B64" || { echo "DEBUG_KEYSTORE_B64 secret is empty or missing"; exit 1; }
          mkdir -p ~/.android
          echo "$KEY_B64" | base64 -d > ~/.android/debug.keystore
          keytool -list -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey > /dev/null
      - name: Build
        if: steps.check.outputs.new == 'true'
        run: chmod +x gradlew && ./gradlew assembleFreeDebug
      - name: Sign with saved key
        if: steps.check.outputs.new == 'true'
        run: |
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          for APK in $(find app/build/outputs/apk -name '*.apk'); do
            "$APKSIGNER" sign --ks ~/.android/debug.keystore --ks-pass pass:android --ks-key-alias androiddebugkey --key-pass pass:android "$APK"
            "$APKSIGNER" verify --print-certs "$APK" | grep SHA-256
          done
          keytool -list -v -keystore ~/.android/debug.keystore -storepass android | grep SHA256
      - name: Publish release
        if: steps.check.outputs.new == 'true'
        run: |
          TAG="${{ steps.check.outputs.tag }}"
          gh release create "$TAG" $(find app/build/outputs/apk -name '*.apk') \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" --notes "Build of upstream AntennaPod $TAG"
